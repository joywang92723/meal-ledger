<style>
  :root {
    --bg: #FFFFFF;
    --card: #FFFDFA;
    --ink: #141210;
    --ink-strong: #000000;
    --ink-soft: #6B584A;
    --border: #E7DED2;
    --accent: #5B3E29;
    --accent-2: #74533A;
    --red: #A23B2E;
    --red-bg: rgba(162, 59, 46, 0.08);
    --green: #2E6B49;
    --green-bg: rgba(46, 107, 73, 0.08);
    --shadow: rgba(59, 42, 30, 0.07);

    padding-top: env(safe-area-inset-top, 0px);

  header.top h1 {

    font-size: clamp(1.4rem, 4vw, 1.85rem);

  header.top p.subtitle { margin: 0; color: var(--ink-soft); font-size: 0.9rem; }

    font-size: 0.72rem;
    padding: 0.28rem 0.6rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .storage-badge.local { border-color: var(--red); color: var(--red); }
  .storage-badge.public { border-color: var(--green); color: var(--green); }

  .hero-num.clear { color: var(--green); }
  .hero-label { font-size: 0.92rem; color: var(--ink-soft); }
  .hero-sub { width: 100%; margin-top: 0.3rem; font-size: 0.84rem; color: var(--ink-soft); }

  .page { max-width: 880px; margin: 0 auto; padding: 1.3rem 1.4rem calc(3rem + env(safe-area-inset-bottom, 0px)); }

    background: var(--card);

    margin-bottom: 1.4rem;
    overflow: hidden;

  .card-head {
    padding: 1rem 1.2rem 0.8rem;

    justify-content: space-between;
    align-items: center;
    gap: 0.6rem;

  .p-check { width: 1.05rem; height: 1.05rem; flex-shrink: 0; accent-color: var(--red); }

  .empty-state { padding: 1.6rem 1.2rem; text-align: center; color: var(--ink-soft); font-size: 0.9rem; }

  input, select {
    font-family: inherit;
    font-size: 0.92rem;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    width: 100%;

  button {
    font-family: inherit; font-size: 0.88rem; font-weight: 500; padding: 0.5rem 0.9rem;
    border-radius: 6px; border: 1px solid transparent; cursor: pointer;
    background: var(--accent); color: #FBF3E6;

  button:hover { background: var(--accent-2); }
  button.secondary { background: transparent; color: var(--ink); border-color: var(--border); }
  button.ghost { background: transparent; color: var(--ink-soft); border: none; padding: 0.3rem 0.5rem; font-size: 0.82rem; text-decoration: underline; }
  button.small { padding: 0.3rem 0.6rem; font-size: 0.8rem; }

  .status-pill { display: inline-block; padding: 0.15rem 0.55rem; border-radius: 999px; font-size: 0.78rem; }
  .status-owe { background: var(--red-bg); color: var(--red); }
  .status-credit { background: var(--green-bg); color: var(--green); }
  .status-even { background: var(--border); color: var(--ink-soft); }

  details.person { border-bottom: 1px solid var(--border); }
  details.person:last-child { border-bottom: none; }
  details.person summary {
    list-style: none; cursor: pointer; padding: 0.85rem 1.2rem;
    display: flex; justify-content: space-between; align-items: center; gap: 0.8rem;
  }
  details.person summary::-webkit-details-marker { display: none; }
  .p-name-row { display: flex; align-items: center; gap: 0.55rem; min-width: 0; }
  .p-name { font-weight: 700; color: var(--ink-strong); font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-caret { color: var(--ink-soft); transition: transform 0.15s; flex-shrink: 0; }

  .p-balance { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 1rem; white-space: nowrap; }

  .person-body { padding: 0 1.2rem 1.1rem; }
  .person-toolbar { display: flex; gap: 0.5rem; margin: 0.2rem 0 0.8rem; }
  .inline-form { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .inline-form input { width: auto; }

  table.history { width: 100%; border-collapse: collapse; }
  table.history th { text-align: left; font-size: 0.74rem; font-weight: 500; color: var(--ink-soft); padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--border); }
  table.history td { padding: 0.45rem 0.5rem; font-size: 0.88rem; border-bottom: 1px dashed var(--border); vertical-align: middle; }
  table.history tr:last-child td { border-bottom: none; }

  .amt.neg { color: var(--red); }
  .row-actions { display: flex; gap: 0.4rem; justify-content: flex-end; white-space: nowrap; }
  .edit-record-row td { padding: 0.5rem; }
  .edit-grid { display: grid; grid-template-columns: 6.5rem 8rem 6rem 8rem auto auto; gap: 0.4rem; align-items: center; }
  .item-field-wrap { display: block; min-width: 0; }
  .item-field-wrap .item-method, .item-field-wrap .item-text { width: 100%; }
  .type-tag { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.76rem; }
  .type-credit { background: var(--green-bg); color: var(--green); }
  .type-order { background: var(--red-bg); color: var(--red); }

  .entry-form { display: grid; grid-template-columns: 8rem 8.5rem 8rem 7rem 8.5rem auto; gap: 0.55rem; padding: 1rem 1.2rem; align-items: stretch; }
  .entry-form button { grid-column: span 1; }
  .entry-empty { padding: 1rem 1.2rem; color: var(--ink-soft); font-size: 0.9rem; }

  footer { text-align: center; font-size: 0.78rem; color: var(--ink-soft); padding-top: 0.6rem; }
  footer button.ghost { font-size: 0.78rem; }

  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(20, 18, 16, 0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 1.2rem; z-index: 1000;
  }
  .confirm-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.3rem 1.3rem 1.1rem; max-width: 22rem; width: 100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  }
  .confirm-msg { margin: 0 0 1.1rem; white-space: pre-wrap; font-size: 0.92rem; color: var(--ink); line-height: 1.65; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 0.6rem; }

  .toast-stack {
    position: fixed; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); display: flex; flex-direction: column; gap: 0.5rem;
    z-index: 1100; width: min(90vw, 22rem); align-items: center;
  }
  .toast {
    background: var(--ink-strong); color: var(--bg); font-size: 0.86rem;
    padding: 0.6rem 1rem; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    text-align: center; white-space: pre-wrap;
  }

  @media (max-width: 700px) {
    .entry-form { grid-template-columns: 1fr 1fr; }
    .entry-form button { grid-column: span 2; }
  }
  @media (max-width: 560px) {
    .edit-grid { grid-template-columns: 1fr 1fr; }
    .edit-grid button { grid-column: span 1; }
    table.history thead { display: none; }
    table.history, table.history tbody, table.history tr, table.history td { display: block; width: 100%; }
    table.history tr { padding: 0.5rem 0; border-bottom: 1px dashed var(--border); }
    table.history td { border-bottom: none; padding: 0.15rem 0; }
    td.amt { text-align: left; }
    .row-actions { justify-content: flex-start; margin-top: 0.3rem; }
  }
</style>
</head>

  function showConfirm(message) {
    return new Promise(function (resolve) {

      overlay.className = 'confirm-overlay';
      var box = document.createElement('div');
      box.className = 'confirm-box';

  function escapeHtml(s) {

    sync();
  }
  function getBalance(personId) {
    return records.reduce(function (sum, r) {
      if (r.personId !== personId) return sum;
      return sum + (isCredit(r.type) ? Number(r.amount) : -Number(r.amount));
    }, 0);
  }
  function recordsFor(personId) {
    return records.filter(function (r) { return r.personId === personId; })
      .slice()
      .sort(function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return (b.createdAt || 0) - (a.createdAt || 0);
      });
  }

  // ---------- local-storage fallback (only used if Firestore truly can't connect) ----------
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        people = parsed.people || [];
        records = parsed.records || [];
      } else {
        var seed = JSON.parse(document.getElementById('ledgerSeedData').textContent);
        people = seed.people || [];
        records = seed.records || [];
      }
    } catch (e) { people = []; records = []; }
  }
  function saveLocal() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ people: people, records: records })); }
    catch (e) { /* ignore quota errors */ }
  }

  // ---------- Firestore CRUD (single source of truth once connected;
  // onSnapshot below keeps `people`/`records` and the UI in sync for
  // every visitor automatically) ----------
  async function seedFirestoreIfEmpty() {
    var snap = await db.collection('people').limit(1).get();
    if (!snap.empty) return;
    var seed;
    try { seed = JSON.parse(document.getElementById('ledgerSeedData').textContent); }
    catch (e) { return; }
    if (!seed.people || !seed.people.length) return;
    var batch = db.batch();
    seed.people.forEach(function (p) {
      batch.set(db.collection('people').doc(p.id), { name: p.name, createdAt: p.createdAt || Date.now() });
    });
    (seed.records || []).forEach(function (r) {
      batch.set(db.collection('records').doc(r.id), {
        personId: r.personId, type: r.type, date: r.date, item: r.item,
        amount: Number(r.amount), createdAt: r.createdAt || Date.now()
      });
    });
    await batch.commit();
  }

  function addPerson(name) {
    name = name.trim();
    if (!name) return;
    if (usingFirestore) {
      db.collection('people').add({ name: name, createdAt: Date.now() })
        .catch(function () { showToast('新增人員失敗，請稍後再試一次。'); });
    } else {
      people.push({ id: uid(), name: name, createdAt: Date.now() });
      saveLocal(); renderAll();
    }
  }
  function renamePerson(id, name) {
    name = name.trim();
    if (!name) return;
    if (usingFirestore) {
      db.collection('people').doc(id).update({ name: name })
        .catch(function () { showToast('更新姓名失敗，請稍後再試一次。'); });
    } else {
      var p = people.find(function (x) { return x.id === id; });
      if (p) p.name = name;
      saveLocal(); renderAll();
    }
  }
  async function deletePerson(id) {
    if (usingFirestore) {
      try {
        var snap = await db.collection('records').where('personId', '==', id).get();
        var batch = db.batch();
        snap.docs.forEach(function (d) { batch.delete(d.ref); });
        batch.delete(db.collection('people').doc(id));
        await batch.commit();
      } catch (e) { showToast('刪除失敗，請稍後再試一次。'); }
    } else {
      people = people.filter(function (p) { return p.id !== id; });
      records = records.filter(function (r) { return r.personId !== id; });
      saveLocal(); renderAll();
    }
  }
  function addRecord(personId, type, date, item, amount) {
    var body = { personId: personId, type: type, date: date, item: item, amount: Number(amount), createdAt: Date.now() };
    if (usingFirestore) {
      db.collection('records').add(body).catch(function () { showToast('新增紀錄失敗，請稍後再試一次。'); });
    } else {
      body.id = uid();
      records.push(body);
      saveLocal(); renderAll();
    }
  }
  function updateRecord(id, fields) {
    if (usingFirestore) {
      db.collection('records').doc(id).update(fields).catch(function () { showToast('更新紀錄失敗，請稍後再試一次。'); });
    } else {
      var r = records.find(function (x) { return x.id === id; });
      if (r) Object.assign(r, fields);
      saveLocal(); renderAll();
    }
  }
  function deleteRecord(id) {
    if (usingFirestore) {
      db.collection('records').doc(id).delete().catch(function () { showToast('刪除失敗，請稍後再試一次。'); });
    } else {
      records = records.filter(function (r) { return r.id !== id; });
      saveLocal(); renderAll();
    }
  }
  async function deleteSelectedPeople() {
    var ids = Array.from(selectedForDelete);
    if (ids.length === 0) return;
    var names = people.filter(function (p) { return ids.indexOf(p.id) !== -1; }).map(function (p) { return p.name; }).join('、');
    if (!(await showPasscodeConfirm('確定要刪除以下 ' + ids.length + ' 位人員嗎？\n' + names + '\n所有相關紀錄也會一併刪除，且無法復原。'))) return;
    if (usingFirestore) {
      try {
        var batch = db.batch();
        for (var i = 0; i < ids.length; i++) {
          var snap = await db.collection('records').where('personId', '==', ids[i]).get();
          snap.docs.forEach(function (d) { batch.delete(d.ref); });
          batch.delete(db.collection('people').doc(ids[i]));
        }
        await batch.commit();
      } catch (e) { showToast('刪除失敗，請稍後再試一次。'); }
    } else {
      ids.forEach(function (id) {
        people = people.filter(function (p) { return p.id !== id; });
        records = records.filter(function (r) { return r.personId !== id; });
      });
      saveLocal();
    }
    deleteMode = false;
    selectedForDelete = new Set();
    renderAll();
  }
  async function settleMonth() {
    if (people.length === 0 && records.length === 0) {
      showToast('目前沒有可歸零的紀錄。');
      return;
    }
    if (records.length > 0 && (await showConfirm('要在歸零前，先匯出這個月的備份嗎？（建議留存紀錄）'))) {
      exportBackup();
    }
    if (!(await showPasscodeConfirm('確定要「還原歸零」嗎？\n這會清除所有交易紀錄，讓每個人的餘額回到 0，但人員名單會保留。\n此動作無法復原。'))) return;
    if (usingFirestore) {
      try {
        var snap = await db.collection('records').get();
        var batch = db.batch();
        snap.docs.forEach(function (d) { batch.delete(d.ref); });
        await batch.commit();
      } catch (e) { showToast('歸零失敗，請稍後再試一次。'); }
    } else {
      records = [];
      saveLocal(); renderAll();
    }
  }
  async function resetAll() {
    if (!(await showPasscodeConfirm('確定要清空所有人員與紀錄嗎？此動作無法復原。'))) return;
    if (usingFirestore) {
      try {
        var ps = await db.collection('people').get();
        var rs = await db.collection('records').get();
        var batch = db.batch();
        ps.docs.forEach(function (d) { batch.delete(d.ref); });
        rs.docs.forEach(function (d) { batch.delete(d.ref); });
        await batch.commit();
      } catch (e) { showToast('清空失敗，請稍後再試一次。'); }
    } else {
      people = []; records = [];
      saveLocal(); renderAll();
    }
  }
  function exportBackup() {
    var payload = { exportedAt: new Date().toISOString(), people: people, records: records };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '記帳本備份-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }
  async function importBackup(file) {
    var text;
    try { text = await file.text(); }
    catch (e) { showToast('讀取檔案失敗。'); return; }
    var parsed;
    try { parsed = JSON.parse(text); }
    catch (e) { showToast('這不是有效的備份檔（JSON 格式錯誤）。'); return; }
    if (!parsed || !Array.isArray(parsed.people) || !Array.isArray(parsed.records)) {
      showToast('這不是有效的備份檔。'); return;
    }
    if (!(await showPasscodeConfirm('匯入備份會覆蓋目前所有人員與紀錄，確定要繼續嗎？'))) return;
    if (usingFirestore) {
      try {
        var ps = await db.collection('people').get();
        var rs = await db.collection('records').get();
        var batch = db.batch();
        ps.docs.forEach(function (d) { batch.delete(d.ref); });
        rs.docs.forEach(function (d) { batch.delete(d.ref); });
        parsed.people.forEach(function (p) {
          batch.set(db.collection('people').doc(p.id || uid()), { name: p.name, createdAt: p.createdAt || Date.now() });
        });
        parsed.records.forEach(function (r) {
          batch.set(db.collection('records').doc(r.id || uid()), {
            personId: r.personId, type: r.type, date: r.date, item: r.item,
            amount: Number(r.amount), createdAt: r.createdAt || Date.now()
          });
        });
        await batch.commit();
      } catch (e) { showToast('匯入失敗，請稍後再試一次。'); }
    } else {
      people = parsed.people;
      records = parsed.records;
      saveLocal(); renderAll();
    }
  }

  // ---------- rendering ----------
  function renderAll() {
    renderHero();
    renderAddPersonRow();
    renderDeleteBar();
    renderPeople();
    renderEntry();
  }

  function renderHero() {
    var totalOwed = 0, owingCount = 0;
    people.forEach(function (p) {
      var bal = getBalance(p.id);
      if (bal < -0.001) { totalOwed += -bal; owingCount++; }
    });
    var heroEl = document.getElementById('heroTotal');
    heroEl.textContent = fmtMoney(totalOwed);
    heroEl.className = 'hero-num num ' + (totalOwed > 0.001 ? 'owe' : 'clear');
    var sub = document.getElementById('heroSub');
    if (people.length === 0) sub.textContent = '尚未新增任何人員';
    else if (owingCount === 0) sub.textContent = '所有人都已結清 🎉';
    else sub.textContent = owingCount + ' 人尚未結清（共 ' + people.length + ' 人）';
  }

  function renderAddPersonRow() {
    var wrap = document.getElementById('addPersonRow');
    var btn = document.getElementById('addPersonToggle');
    btn.textContent = showAddPerson ? '×' : '＋';
    btn.title = showAddPerson ? '取消新增' : '新增人員';
    if (!showAddPerson) { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
    wrap.style.display = 'block';
    wrap.innerHTML = '<form class="add-person-row" id="addPersonForm">' +
      '<input type="text" id="newPersonName" placeholder="輸入姓名" maxlength="20" required style="width:auto; flex:1">' +
      '<button type="submit">新增</button>' +
      '</form>';
    document.getElementById('addPersonForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var input = document.getElementById('newPersonName');
      addPerson(input.value);
      showAddPerson = false;
      renderAddPersonRow();
    });
    document.getElementById('newPersonName').focus();
  }

  function renderDeleteBar() {
    var btn = document.getElementById('deleteModeToggle');
    var bar = document.getElementById('deleteBar');
    btn.title = deleteMode ? '取消刪除' : '刪除人員';
    btn.style.background = deleteMode ? 'var(--red-bg)' : 'transparent';
    btn.style.borderColor = deleteMode ? 'var(--red)' : 'var(--border)';
    btn.style.color = deleteMode ? 'var(--red)' : 'var(--ink-strong)';
    if (!deleteMode) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
    bar.style.display = 'flex';
    bar.className = 'delete-bar';
    var n = selectedForDelete.size;
    bar.innerHTML = '<span class="count">已勾選 ' + n + ' 人</span>' +
      '<span class="actions">' +
        '<button type="button" class="secondary small" id="cancelDeleteBtn">取消</button>' +
        '<button type="button" class="small" id="confirmDeleteBtn"' + (n === 0 ? ' disabled' : '') + ' style="background:var(--red)">刪除選取的人員</button>' +
      '</span>';
    document.getElementById('cancelDeleteBtn').addEventListener('click', function () {
      deleteMode = false; selectedForDelete = new Set();
      renderDeleteBar(); renderPeople();
    });
    document.getElementById('confirmDeleteBtn').addEventListener('click', deleteSelectedPeople);
  }

  function historyRowHtml(r) {
    if (editingRecordId === r.id) {
      return '<tr class="edit-record-row"><td colspan="5">' +
        '<form class="edit-grid" data-save-record="' + r.id + '">' +
          '<select name="type">' + typeOptionsHtml(r.type) + '</select>' +
          '<span class="item-field-wrap">' + itemFieldsHtml(r.type, r.type === 'credit' ? r.item : '', r.type === 'order' ? r.item : '') + '</span>' +
          '<input type="number" name="amount" value="' + r.amount + '" min="0.01" step="0.01" required>' +
          '<input type="date" name="date" value="' + escapeHtml(r.date) + '" required>' +
          '<button type="submit" class="small">儲存</button>' +
          '<button type="button" class="secondary small" data-cancel-record>取消</button>' +
        '</form>' +
      '</td></tr>';
    }
    var credit = isCredit(r.type);
    return '<tr>' +
      '<td class="num">' + fmtDate(r.date) + '</td>' +
      '<td><span class="type-tag ' + TYPE_CLASS[r.type] + '">' + TYPE_LABEL[r.type] + '</span></td>' +
      '<td>' + escapeHtml(itemDisplay(r)) + '</td>' +
      '<td class="amt ' + (credit ? 'pos' : 'neg') + '">' + (credit ? '+' : '−') + fmtMoney(r.amount) + '</td>' +
      '<td><div class="row-actions">' +
        '<button type="button" class="ghost" data-edit-record="' + r.id + '">編輯</button>' +
        '<button type="button" class="ghost" data-del-record="' + r.id + '">刪除</button>' +
      '</div></td>' +
      '</tr>';
  }

  function personCardHtml(p, isTopDebtor) {
    var bal = getBalance(p.id);
    var isOpen = expandedIds.has(p.id);
    var recs = recordsFor(p.id);
    var balColor = bal < -0.001 ? 'var(--red)' : (bal > 0.001 ? 'var(--green)' : 'var(--ink-soft)');

    var body = '<div class="person-body">';
    if (editingPersonId === p.id) {
      body += '<form class="inline-form" data-save-person="' + p.id + '" style="margin:0.2rem 0 0.8rem">' +
        '<input type="text" name="name" value="' + escapeHtml(p.name) + '" maxlength="20" required style="max-width:12rem">' +
        '<button type="submit" class="small">儲存</button>' +
        '<button type="button" class="secondary small" data-cancel-person>取消</button>' +
        '</form>';
    } else {
      body += '<div class="person-toolbar">' +
        '<button type="button" class="ghost" data-edit-person="' + p.id + '">編輯姓名</button>' +
        '<button type="button" class="ghost" data-del-person="' + p.id + '">刪除人員</button>' +
        '</div>';
    }
    if (recs.length === 0) {
      body += '<div class="empty-state">尚無紀錄，到下方「新增紀錄」開始第一筆吧。</div>';
    } else {
      body += '<table class="history"><thead><tr><th>日期</th><th>類型</th><th>項目</th><th style="text-align:right">金額</th><th></th></tr></thead><tbody>';
      recs.forEach(function (r) { body += historyRowHtml(r); });
      body += '</tbody></table>';
    }
    body += '</div>';

    return '<details class="person" id="person-' + p.id + '"' + (isOpen ? ' open' : '') + '>' +
      '<summary>' +
      (deleteMode ? '<input type="checkbox" class="p-check" data-select-person="' + p.id + '"' + (selectedForDelete.has(p.id) ? ' checked' : '') + '>' : '') +
      '<span class="p-name-row"><span class="p-caret">▸</span><span class="p-name">' + escapeHtml(p.name) + (isTopDebtor ? ' 👑' : '') + '</span></span>' +
      '<span class="p-balance num" style="color:' + balColor + '">' +
        (bal < 0 ? '−' : bal > 0 ? '+' : '') + fmtMoney(bal) + '</span></summary>' +
      body +
      '</details>';
  }

  function renderPeople() {
    var wrap = document.getElementById('peopleWrap');
    var hint = document.getElementById('overviewHint');
    if (people.length === 0) {
      wrap.innerHTML = '<div class="empty-state">還沒有人員，點右上角的「＋」新增第一位吧。</div>';
      hint.textContent = '';
      return;
    }
    hint.textContent = deleteMode ? '勾選要刪除的人員' : '點姓名可展開紀錄';
    var sorted = people.map(function (p) { return { p: p, bal: getBalance(p.id) }; })
      .sort(function (a, b) { return a.bal - b.bal; })
      .map(function (row) { return row.p; });
    wrap.innerHTML = sorted.map(function (p, idx) {
      var isTop = idx === 0 && getBalance(p.id) < -0.001;
      return personCardHtml(p, isTop);
    }).join('');

    wrap.querySelectorAll('details.person').forEach(function (det) {
      det.addEventListener('toggle', function () {
        var id = det.id.replace('person-', '');
        if (det.open) expandedIds.add(id); else expandedIds.delete(id);
      });
    });
    wrap.querySelectorAll('[data-select-person]').forEach(function (cb) {
      cb.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var id = cb.getAttribute('data-select-person');
        if (selectedForDelete.has(id)) selectedForDelete.delete(id); else selectedForDelete.add(id);
        renderDeleteBar();
        renderPeople();
      });
    });
    wrap.querySelectorAll('[data-edit-person]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        editingPersonId = btn.getAttribute('data-edit-person');
        renderPeople();
      });
    });
    wrap.querySelectorAll('[data-cancel-person]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        editingPersonId = null;
        renderPeople();
      });
    });
    wrap.querySelectorAll('[data-save-person]').forEach(function (form) {
      form.addEventListener('submit', function (e) {
        e.preventDefault(); e.stopPropagation();
        var id = form.getAttribute('data-save-person');
        var name = form.elements['name'].value;
        editingPersonId = null;
        renamePerson(id, name);
      });
    });
    wrap.querySelectorAll('[data-del-person]').forEach(function (btn) {
      btn.addEventListener('click', async function (e) {
        e.stopPropagation();
        var id = btn.getAttribute('data-del-person');
        var p = people.find(function (x) { return x.id === id; });
        if (await showPasscodeConfirm('確定要刪除「' + (p ? p.name : '') + '」嗎？這個人的所有紀錄也會一併刪除，且無法復原。')) deletePerson(id);
      });
    });
    wrap.querySelectorAll('[data-edit-record]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        editingRecordId = btn.getAttribute('data-edit-record');
        renderPeople();
      });
    });
    wrap.querySelectorAll('[data-cancel-record]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        editingRecordId = null;
        renderPeople();
      });
    });
    wrap.querySelectorAll('[data-save-record]').forEach(function (form) {
      form.addEventListener('click', function (e) { e.stopPropagation(); });
      wireItemFieldToggle(form);
      form.addEventListener('submit', function (e) {
        e.preventDefault(); e.stopPropagation();
        var id = form.getAttribute('data-save-record');
        var savedType = form.elements['type'].value;
        var item = savedType === 'credit' ? form.elements['method'].value : form.elements['itemText'].value;
        var fields = {
          type: savedType,
          item: item,
          amount: Number(form.elements['amount'].value),
          date: form.elements['date'].value
        };
        if (!fields.amount || fields.amount <= 0) return;
        editingRecordId = null;
        updateRecord(id, fields);
      });
    });
    wrap.querySelectorAll('[data-del-record]').forEach(function (btn) {
      btn.addEventListener('click', async function (e) {
        e.stopPropagation();
        var id = btn.getAttribute('data-del-record');
        if (await showPasscodeConfirm('確定要刪除這筆紀錄嗎？')) deleteRecord(id);
      });
    });
  }

  function renderEntry() {
    var wrap = document.getElementById('entryWrap');
    if (people.length === 0) {
      wrap.innerHTML = '<div class="entry-empty">請先新增人員，才能開始記錄儲值/還款或訂餐。</div>';
      return;
    }
    var sorted = people.slice().sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    var options = '<option value="">選擇姓名</option>' + sorted.map(function (p) {
      return '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>';
    }).join('');
    wrap.innerHTML = '<form class="entry-form" id="quickEntryForm">' +
      '<select name="personId" required>' + options + '</select>' +
      '<select name="type">' + typeOptionsHtml('credit') + '</select>' +
      '<span class="item-field-wrap">' + itemFieldsHtml('credit', '', '') + '</span>' +
      '<input type="number" name="amount" placeholder="金額" min="0.01" step="0.01" required>' +
      '<input type="date" name="date" value="' + todayStr() + '" required>' +
      '<button type="submit">新增紀錄</button>' +
      '</form>';
    var form = document.getElementById('quickEntryForm');
    wireItemFieldToggle(form);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target;
      var personId = f.elements['personId'].value;
      var type = f.elements['type'].value;
      var item = type === 'credit' ? f.elements['method'].value : f.elements['itemText'].value;
      var amount = f.elements['amount'].value;
      var date = f.elements['date'].value;
      if (!personId || !amount || Number(amount) <= 0) return;
      if (type === 'order' && !item.trim()) { showToast('請填寫訂餐的項目。'); return; }
      addRecord(personId, type, date, item, amount);
      f.elements['amount'].value = '';
      f.elements['itemText'].value = '';
      expandedIds.add(personId);
    });
  }

  // ---------- init ----------
  function updateStorageBadge(state) {
    var badge = document.getElementById('storageBadge');
    var note = document.getElementById('footerNote');
    if (state === 'connected') {
      badge.textContent = '雲端同步';
      badge.classList.remove('local');
      badge.classList.add('public');
      note.textContent = '任何拿到這個連結的人都能即時看到最新資料，也都能新增/編輯。';
    } else if (state === 'local') {
      badge.textContent = '僅本機儲存';
      badge.classList.remove('public');
      badge.classList.add('local');
      note.textContent = '⚠ 目前連不上雲端資料庫，資料暫時僅儲存在這個瀏覽器裡。';
    } else {
      badge.textContent = '連線中…';
    }
  }

  async function initStorage() {
    try {
      if (typeof firebase === 'undefined') throw new Error('firebase sdk not loaded');
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      await seedFirestoreIfEmpty();
      usingFirestore = true;
      db.collection('people').orderBy('createdAt', 'asc').onSnapshot(function (snap) {
        people = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        renderAll();
      }, function () { showToast('與雲端資料庫的連線中斷了，請重新整理頁面。'); });
      db.collection('records').onSnapshot(function (snap) {
        records = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        renderAll();
      }, function () { showToast('與雲端資料庫的連線中斷了，請重新整理頁面。'); });
      updateStorageBadge('connected');
    } catch (e) {
      usingFirestore = false;
      loadLocal();
      renderAll();
      updateStorageBadge('local');
    }
  }

  document.getElementById('addPersonToggle').addEventListener('click', function () {
    showAddPerson = !showAddPerson;
    if (showAddPerson) { deleteMode = false; selectedForDelete = new Set(); renderDeleteBar(); renderPeople(); }
    renderAddPersonRow();
  });
  document.getElementById('deleteModeToggle').addEventListener('click', function () {
    deleteMode = !deleteMode;
    if (deleteMode) { showAddPerson = false; renderAddPersonRow(); }
    else { selectedForDelete = new Set(); }
    renderDeleteBar();
    renderPeople();
  });
  document.getElementById('resetBtn').addEventListener('click', resetAll);
  document.getElementById('settleBtn').addEventListener('click', settleMonth);
  document.getElementById('exportBtn').addEventListener('click', exportBackup);
  document.getElementById('importBtn').addEventListener('click', function () {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (file) importBackup(file);
    e.target.value = '';
  });

  renderAll();
  initStorage();
})();
</script>
</body>
</html>
